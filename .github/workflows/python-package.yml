# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable, develop]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel tox
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 --ignore=E501,E226,W503,W504,W605 gfs_dynamical_core/ --count --show-source --statistics
      - name: Build gfs
        run: |
          TOX_ENV=py$(echo ${{ matrix.python-version }} | tr -d '.')
          if [ "$RUNNER_OS" == "Linux" ]; then
            gfortran --version
            CLIMT_ARCH=Linux tox -e $TOX_ENV
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # which gcc #/usr/bin/gcc
            # which gfortran
            CLIMT_ARCH=Darwin tox -e $TOX_ENV
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi
        shell: bash
