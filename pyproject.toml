[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=0.25", "numpy>=1.16.0", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "gfs_dynamical_core"
version = "0.3.0"
description = "Only the dynamical core of the climt repository"
readme = "README.rst"
authors = [
    { name = "Abel Shibu", email = "abels2000@gmail.com" }
]
license = { text = "BSD-3-Clause" }
keywords = ["gfs_dynamical_core"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.16.0",
    "pint>=0.7.0",
    "xarray>=0.8.0",
    "sympl>=0.5.0",
    "cython>=0.25",
    "scipy>=0.18.1",
    "climt>=0.18.4",
    "jax==0.5.3",
    "jaxlib==0.5.3",
    "s2fft==1.3.0",
    "flax==0.10.6",
]

[project.optional-dependencies]
dev = [
    "pip>=22.0",
    "bump2version>=0.5.11",
    "wheel>=0.38.1",
    "watchdog>=2.1.6",
    "flake8>=5.0.4",
    "tox>=3.25.1",
    "coverage>=6.4.4",
    "Sphinx>=5.1.1",
    "twine>=4.0.1",
    "pytest>=7.1.3",
    "pytest-runner>=6.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.291",
]

[project.urls]
Homepage = "https://github.com/Ai33L/gfs_dynamical_core.git"

[tool.setuptools]
py-modules = ["gfs_dynamical_core.component"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"*" = ["*"]

[tool.ruff]
exclude = [
    ".git",
    ".tox",
    "build",
    "dist",
    "docs",
    "gfs_dynamical_core/_lib",
]
line-length = 88
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
