[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=0.25", "numpy>=1.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfs_dynamical_core"
version = "0.1.39"
description = "Only the dynamical core of the climt repository"
readme = "README.rst"
authors = [
    { name = "Abel Shibu", email = "abels2000@gmail.com" }
]
license = { text = "BSD-3-Clause" }
keywords = ["gfs_dynamical_core"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.16.0",
    "pint>=0.7.0",
    "xarray>=0.8.0",
    "sympl==0.5.0",
    "cython>=0.25",
    "scipy>=0.18.1",
    "climt==0.17.13",
]

[project.urls]
Homepage = "https://github.com/Ai33L/gfs_dynamical_core.git"

[tool.setuptools]
py-modules = ["gfs_dynamical_core.component"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"*" = ["*"]

[tool.ruff]
exclude = [
    ".git",
    ".tox",
    "build",
    "dist",
    "docs",
    "gfs_dynamical_core/_lib",
]
line-length = 88
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
